          "@type": "Question",

            "@type": "Answer",
            "text": "Jhirah only lets you email customers who have physically visited your location. These are warm, verified contacts who already know your business — delivering open rates 3–5× higher than typical social media ad click-through rates, with zero wasted spend on cold audiences."

        },
        {
          "@type": "Question",
          "name": "How does Jhirah compare to SEO for local businesses?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "SEO drives discovery from strangers. Jhirah drives repeat visits from people who have already chosen you. Email marketing to verified visitors converts at far higher rates than organic search traffic because the recipient already trusts your brand."
          }
        },
        {
          "@type": "Question",
          "name": "How do customers earn loyalty points?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Customers scan a location-locked QR code at your door to check in, then keep their phone screen locked during their visit. They earn 100 points per 30 minutes of locked time (worth $1.00). Points are redeemed for rewards you configure."
          }
        },
        {
          "@type": "Question",
          "name": "What types of email campaigns can I send?",
